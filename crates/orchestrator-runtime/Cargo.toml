[package]
name = "orchestrator-runtime"
description = "Process supervision, cancellation, and crash recovery for agent subprocesses. Owns child process handles, stdio streaming, exit reconciliation, and process-tree cleanup. Updated: 2026-11-07T15:00-07:00"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
# Acyclic: git has no orchestrator dependencies. Reconciliation consumes its plans.
orchestrator-git = { path = "../orchestrator-git" }
# Pinned per the workspace root rule (direct dependencies pinned with `=`).
tokio = { version = "=1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros"] }
thiserror = "=2.0.21"
# Unix process-group signal delivery for cancellation and tree cleanup.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
# Windows Job Objects + Toolhelp snapshots for reliable descendant cleanup.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = "=3.27.0"
