[package]
name = "orchestrator-cli"
description = "Standalone CLI client for the orchestration engine. Runs the engine in-process; no Tauri or desktop dependency."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
fault-injection = []

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
orchestrator-agents = { path = "../orchestrator-agents" }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-engine = { path = "../orchestrator-engine" }
orchestrator-git = { path = "../orchestrator-git" }
orchestrator-runtime = { path = "../orchestrator-runtime" }
orchestrator-store = { path = "../orchestrator-store" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[dev-dependencies]
orchestrator-diagnostics = { path = "../orchestrator-diagnostics" }
# Same pin/features as orchestrator-store: lets tests install and drop an SQLite
# fault trigger portably, without the `sqlite3` binary.
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tempfile = "=3.27.0"
