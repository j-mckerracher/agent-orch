[package]
name = "orchestrator-git"
description = "System-git-based repository validation and task worktree creation. Keeps the primary checkout read-only; never deletes anything."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }


[dev-dependencies]
tempfile = "=3.27.0"
