[package]
name = "orchestrator-store"
description = "Local task persistence via SQLite WAL and JSON files behind a shared Store API."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-private-fs = { path = "../orchestrator-private-fs" }
# serde/serde_json serialize domain records; std::fs handles FileStore I/O.
# SQLx runs SQLite; a Tokio worker preserves synchronous Store signatures.
# Updated: 2026-11-07T22:02:32-07:00.
sqlx = { version = "=0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "=1.54.1", features = ["rt", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
# tempfile isolates SQLite test databases and removes them on drop.
tempfile = "=3.27.0"
