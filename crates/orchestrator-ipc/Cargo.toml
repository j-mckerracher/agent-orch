[package]
name = "orchestrator-ipc"
description = "JSON-RPC protocol plus server/client for the authenticated local IPC between the daemon and clients (CLI, desktop, future mobile)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
subtle = "=2.6.1"
thiserror = "=2.0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes"] }

[dev-dependencies]
tempfile = "=3.27.0"
