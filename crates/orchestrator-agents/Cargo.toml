[package]
name = "orchestrator-agents"
description = "Capability-aware adapters for Codex, Claude Code, and Pi subprocess protocols. Implements the adapter contract defined by orchestrator-core on top of orchestrator-runtime's process supervisor. Updated: 2026-11-07T15:00-07:00"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orchestrator-runtime = { path = "../orchestrator-runtime" }
# Pinned per the workspace root rule (direct dependencies pinned with `=`).
tokio = { version = "=1.54.1", features = ["rt", "process", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
async-trait = "=0.1.89"
uuid = { version = "=1.18.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros"] }
