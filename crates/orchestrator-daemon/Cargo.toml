[package]
name = "orchestrator-daemon"
description = "Long-lived orchestration daemon binary. Composes the workspace crates behind a local IPC server; launches on demand, never as a system service."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
orchestrator-ipc = { path = "../orchestrator-ipc" }
orchestrator-store = { path = "../orchestrator-store" }
orchestrator-core = { path = "../orchestrator-core" }
orchestrator-git = { path = "../orchestrator-git" }
orchestrator-runtime = { path = "../orchestrator-runtime" }
orchestrator-agents = { path = "../orchestrator-agents" }
orchestrator-engine = { path = "../orchestrator-engine" }
orchestrator-host-metrics = { path = "../orchestrator-host-metrics" }
tokio = { version = "=1.54.1", features = ["rt", "time", "macros"] }
uuid = { version = "=1.18.1", features = ["v4"] }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.27.0"

# Re-executes its own binary as the fake agent, so it needs a custom main and
# runs identically on Unix and Windows (`cargo test -p orchestrator-daemon --test lifecycle`).
[[test]]
name = "lifecycle"
harness = false

# Same re-exec pattern as `lifecycle`; proves `queue.snapshot` over the platform
# transport with two simultaneous tasks at the default 2/2 limits.
[[test]]
name = "queue_snapshot"
harness = false
