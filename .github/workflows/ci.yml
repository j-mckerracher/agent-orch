name: ci

# Native gates on macOS and Windows. The gate list, expected counts and verdict rules live in
# scripts/ci/gates.mjs (Windows mirrors docs/evidence/priority-11r3-windows-acceptance-efa5e8a-runbook.md).
# The Windows gates run as parallel jobs. A pull request runs only the jobs its changed files need
# (scripts/ci/windows-jobs.mjs); every other event runs all of them. `gates (windows)` is the one verdict
# over all of them. See docs/release-ci.md.

on:
  pull_request:
  push:
    branches: [main]
  # Nightly on the default branch: every Windows job runs, including the installer, whatever changed.
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: windows change selection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      engine: ${{ steps.select.outputs.engine }}
      tauri: ${{ steps.select.outputs.tauri }}
      desktop: ${{ steps.select.outputs.desktop }}
      package: ${{ steps.select.outputs.package }}
      smoke: ${{ steps.select.outputs.smoke }}
    steps:
      # On a pull request, HEAD is GitHub's merge commit and HEAD^1 is the base branch: two commits are enough.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select the Windows gate groups
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/windows-jobs.mjs select --event "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  harness:
    name: "windows: harness"
    needs: changes
    if: always()
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      # Before checkout, so the working tree is written with LF and long paths work on Windows.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global --list | grep -E '^core\.(autocrlf|longpaths)='

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Harness self-tests
        run: node --test "scripts/**/*.test.mjs"

      - name: Usage reader smoke test
        if: needs.changes.outputs.smoke == 'true'
        run: |
          node --test --test-reporter=tap "scripts/smoke/*.smoke.mjs" | tee "$RUNNER_TEMP/usage-smoke.tap"
          node apps/desktop/src-tauri/sidecars/codeburn/require-tap-totals.mjs "$RUNNER_TEMP/usage-smoke.tap" 4
      - name: Native gates
        run: |
          node scripts/ci/run-gates.mjs \
            --only "$(node scripts/ci/windows-jobs.mjs gates harness)" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --target-dir "$RUNNER_TEMP/target" \
            --test-tmp "$RUNNER_TEMP/tt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-windows-harness
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  engine-build:
    name: "windows: engine build"
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUST_TOOLCHAIN: "1.96.0"
      # Build time on Windows: no incremental state, and no debug info (its PDBs dominate MSVC link time).
      # No gate reads debug info: they assert counts, test names and build lines.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global --list | grep -E '^core\.(autocrlf|longpaths)='

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv
          cargo -V
          cargo clippy -V
          node --version
          npm --version
          git --version

      # Not restored for a tag (release builds stay hermetic). Saved only from a push to main, see below.
      - name: Restore the Cargo cache
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-windows-engine-build-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-v2-windows-engine-build-${{ env.RUST_TOOLCHAIN }}-

      # Cargo judges local packages by file mtimes. A restored target can only look newer than the checkout if it was
      # saved after this checkout, so the local sources are touched after the restore: the checkout is always the newest.
      - name: Touch the local sources after the cache restore
        run: find crates apps/desktop/src-tauri -type f -exec touch {} +

      # The pinned treehouse worktree tool (DPES-1044) for the tests that lease worktrees. The debug daemon reads
      # AGENT_ORCH_TREEHOUSE_PROGRAM before PATH. The staging script checks the archive and binary SHA-256 pins.
      - name: Fetch pinned treehouse
        run: |
          node apps/desktop/scripts/prepare-treehouse-sidecar.mjs --dest "$GITHUB_WORKSPACE/target/treehouse"
          exe=""; if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          echo "AGENT_ORCH_TREEHOUSE_PROGRAM=$GITHUB_WORKSPACE/target/treehouse/treehouse$exe" >> "$GITHUB_ENV"

      - name: Native gates
        run: |
          node scripts/ci/run-gates.mjs \
            --only "$(node scripts/ci/windows-jobs.mjs gates engine-build)" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --target-dir "$RUNNER_TEMP/target" \
            --test-tmp "$RUNNER_TEMP/tt" \
            --target-from-cache

      - name: Prune the local packages from the target
        if: success()
        run: node scripts/ci/prune-target.mjs --target-dir "$RUNNER_TEMP/target" --dir .

      - name: Save the Cargo cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-windows-engine-build-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-windows-engine-build
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

