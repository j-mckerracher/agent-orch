            ${{ runner.temp }}/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-windows-tauri-tests-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-windows-tauri-tests
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  desktop:
    name: "windows: desktop"
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global --list | grep -E '^core\.(autocrlf|longpaths)='

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Native gates
        run: |
          node scripts/ci/run-gates.mjs \
            --only "$(node scripts/ci/windows-jobs.mjs gates desktop)" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --target-dir "$RUNNER_TEMP/target" \
            --test-tmp "$RUNNER_TEMP/tt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-windows-desktop
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  desktop-package:
    name: "windows: desktop package"
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUST_TOOLCHAIN: "1.96.0"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global --list | grep -E '^core\.(autocrlf|longpaths)='

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv
          cargo -V
          cargo clippy -V
          node --version
          npm --version
          git --version

      - name: Restore the Cargo cache
        id: cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-windows-desktop-package-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-v2-windows-desktop-package-${{ env.RUST_TOOLCHAIN }}-

      # Cargo judges local packages by file mtimes. A restored target can only look newer than the checkout if it was
      # saved after this checkout, so the local sources are touched after the restore: the checkout is always the newest.
      - name: Touch the local sources after the cache restore
        run: find crates apps/desktop/src-tauri -type f -exec touch {} +

      - name: Native gates
        run: |
          node scripts/ci/run-gates.mjs \
            --only "$(node scripts/ci/windows-jobs.mjs gates desktop-package)" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --target-dir "$RUNNER_TEMP/target" \
            --test-tmp "$RUNNER_TEMP/tt" \
            --target-from-cache

      - name: Prune the local packages from the target
        if: success()
        run: node scripts/ci/prune-target.mjs --target-dir "$RUNNER_TEMP/target" --dir . --dir apps/desktop/src-tauri

      - name: Save the Cargo cache
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/target
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-v2-windows-desktop-package-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'apps/desktop/src-tauri/Cargo.lock') }}

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-windows-desktop-package
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  # The one Windows verdict, and the check name branch protection watches. Each job must succeed when its group
  # was selected and must be skipped (or succeed) when it was not. The harness always runs.
  gates-windows:
    name: gates (windows)
    needs: [changes, harness, engine-build, engine-tests-a, engine-tests-b, tauri-build, tauri-tests, desktop, desktop-package]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verdict over the Windows jobs
        run: node scripts/ci/windows-jobs.mjs verdict

  # The macOS gates run as parallel legs of one matrix job (the table is MACOS_JOBS in scripts/ci/windows-jobs.mjs).
  # `gates (macos)` is the one verdict over them.
  macos:
    name: "macos: ${{ matrix.job }}"
    needs: changes
    if: always()
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: [engine, crates, desktop]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUST_TOOLCHAIN: "1.95.0"
    steps:
      # Before checkout, so the working tree is written with LF and long paths work on Windows.
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global --list | grep -E '^core\.(autocrlf|longpaths)='

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv
          cargo -V
          cargo clippy -V
          node --version
          npm --version
          git --version

      - name: Harness self-tests
        if: matrix.job == 'crates'
        run: node --test "scripts/**/*.test.mjs"

      - name: Usage reader smoke test
        if: matrix.job == 'crates' && needs.changes.outputs.smoke == 'true'
        run: |
          node --test --test-reporter=tap "scripts/smoke/*.smoke.mjs" | tee "$RUNNER_TEMP/usage-smoke.tap"
          node apps/desktop/src-tauri/sidecars/codeburn/require-tap-totals.mjs "$RUNNER_TEMP/usage-smoke.tap" 4

      # The pinned treehouse worktree tool (DPES-1044) for the tests that lease worktrees. The debug daemon reads
      # AGENT_ORCH_TREEHOUSE_PROGRAM before PATH. The staging script checks the archive and binary SHA-256 pins.
      - name: Fetch pinned treehouse
        run: |
          node apps/desktop/scripts/prepare-treehouse-sidecar.mjs --dest "$GITHUB_WORKSPACE/target/treehouse"
          exe=""; if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          echo "AGENT_ORCH_TREEHOUSE_PROGRAM=$GITHUB_WORKSPACE/target/treehouse/treehouse$exe" >> "$GITHUB_ENV"

      # One step runs this leg's gates once, in order, with its own target dir and test temp dir.
      # The evidence and target dirs are outside the checkout so the tree stays clean.
      - name: Native gates
        run: |
          node scripts/ci/run-gates.mjs \
            --only "$(node scripts/ci/windows-jobs.mjs macos-gates ${{ matrix.job }})" \
            --evidence-dir "$RUNNER_TEMP/evidence" \
            --target-dir "$RUNNER_TEMP/target" \
            --test-tmp "$RUNNER_TEMP/tt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-evidence-macos-${{ matrix.job }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 30

  macos-verdict:
    name: gates (macos)
    needs: macos
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Verdict over the macOS jobs
        env:
          RESULT: ${{ needs.macos.result }}
        run: |
          echo "macos matrix: $RESULT"
          test "$RESULT" = success
