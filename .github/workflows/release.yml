name: release

# Release builds for macOS and Windows, and for a `v*` tag the GitHub release that carries them. The
# build jobs build artifacts only. This workflow does not re-run ci.yml or audit.yml: the release pull
# request's own checks are the gate, and a new advisory or a flaky test must not stop the installers
# for a commit that already merged. A release starts on a `v*` tag, from either of two runs: a tag push,
# or the run that release-please dispatches on the tag it created when its release pull request merged
# (dispatch with publish=true). The publish job checks the tag against the app version, uploads the
# installers to the draft release release-please made (or creates the release), and publishes it. A
# prerelease while any installer is unsigned. A run on a branch never publishes; a manual run publishes
# only when publish is set on a `v*` tag. Signing is parameterized by secrets of the `release`
# environment; when they are absent the job still builds, warns, and labels the artifact UNSIGNED (see
# scripts/release/signing.mjs) for a manual run. A `v*` tag build FAILS without signing secrets unless
# the repository variable ALLOW_UNSIGNED_RELEASE is "true". Set REQUIRE_SIGNING (input or repository
# variable) to make absent secrets an error for a manual run too. See docs/release-ci.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail instead of building unsigned when signing secrets are absent
        type: boolean
        default: false
      publish:
        description: Publish the release for a v* tag ref (release-please sets this; a tag push publishes without it)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-15, rust: "1.95.0", node: "26.13.0" }
          - { name: windows, runner: windows-2025, rust: "1.96.0", node: "22.20.0" }
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUST_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # The only step that sees signing secrets. Absent secrets are empty strings and skip signing.
      - name: Package
        id: package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          REQUIRE_SIGNING: ${{ (inputs.require_signing && 'true') || vars.REQUIRE_SIGNING || 'false' }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/release/package.mjs "${{ matrix.name }}" --out "$RUNNER_TEMP/release"

      # Installs the artifact just built, runs the packaged daemon through install, cancel, recovery and
      # approvals, and (for a signed build) verifies the signatures. Not a clean machine: see docs/release-ci.md.
      - name: Install smoke
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          SIGNED: ${{ steps.package.outputs.signed }}
          PLATFORM: ${{ matrix.name }}
          ALLOW_UNSIGNED_RELEASE: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          cargo build --locked -p orchestrator-daemon --example release_smoke
          exe=""; if [ "$PLATFORM" = "windows" ]; then exe=".exe"; fi
          # The signing policy is explicit: a signed build must verify as signed; an unsigned build is
          # only accepted off a tag, or on a tag when ALLOW_UNSIGNED_RELEASE=true was set on purpose.
          if [ "$SIGNED" = "true" ]; then
            policy="--require-signed"
          else
            if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$ALLOW_UNSIGNED_RELEASE" != "true" ]; then
              echo "::error::unsigned build on a tag without ALLOW_UNSIGNED_RELEASE=true"
              exit 1
            fi
            echo "::warning::unsigned build: this install smoke proves nothing about code signing or SmartScreen/Gatekeeper"
            policy="--allow-unsigned"
          fi
          mkdir -p "$RUNNER_TEMP/smoke-evidence"
          node scripts/release/install-smoke.mjs "$PLATFORM" \
            --artifact-dir "$RUNNER_TEMP/release" --work "$RUNNER_TEMP/smk" \
            --smoke-bin "$CARGO_TARGET_DIR/debug/examples/release_smoke$exe" \
            --out "$RUNNER_TEMP/smoke-evidence/install-smoke.json" "$policy"

      - name: Upload install smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/smoke-evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}-${{ steps.package.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish (GitHub release)
    # Only on a `v*` tag, after both builds passed (signed or unsigned), and only for a tag push or a run
    # that set publish. A manual run on a branch, or without publish, never reaches this job.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish)
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The job holds no signing secrets: only the build step does. The environment also limits the job to
    # v* tags, and it can require a reviewer's approval before the release goes public.
    environment: release
    # The only job with write access: it creates the release for the tag that was pushed.
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/downloads

      # Fails unless the tag equals v plus the version in every version source, and every installer
      # matches the digest its build recorded. Writes the assets and the release notes.
      - name: Check versions and assemble the release
        id: assemble
        run: node scripts/release/publish.mjs "$TAG" --downloads "$RUNNER_TEMP/downloads" --out "$RUNNER_TEMP/publish"

      # The only step that sees the token. release-please makes the draft release when its pull request
      # merges; a tag push has none yet, so the release is created as a draft first. The installers are
      # uploaded before the release goes public. --verify-tag stops it from publishing a tag that was not pushed.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.assemble.outputs.prerelease }}
        run: |
          notes="$RUNNER_TEMP/publish/release-notes.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/publish/assets"/*
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$notes" \
            --draft=false --prerelease="$PRERELEASE" --verify-tag
