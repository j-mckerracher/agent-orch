name: release

# Release builds for macOS and Windows. Builds artifacts only: nothing is published, no GitHub
# release is created. Signing is parameterized by secrets of the `release` environment; when they
# are absent the job still builds, warns, and labels the artifact UNSIGNED (see
# scripts/release/signing.mjs). Set REQUIRE_SIGNING (input or repository variable) to make absent
# secrets an error. See docs/release-ci.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      require_signing:
        description: Fail instead of building unsigned when signing secrets are absent
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify (native gates)
    uses: ./.github/workflows/ci.yml

  verify-audit:
    name: verify (dependency audits)
    uses: ./.github/workflows/audit.yml

  build:
    name: build (${{ matrix.name }})
    needs: [verify, verify-audit]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, runner: macos-15, rust: "1.95.0", node: "26.13.0" }
          - { name: windows, runner: windows-2025, rust: "1.96.0", node: "22.20.0" }
    defaults:
      run:
        shell: bash
    env:
      CI: "true"
      RUST_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: Configure git
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
          rustc -Vv

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      # The only step that sees signing secrets. Absent secrets are empty strings and skip signing.
      - name: Package
        id: package
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
          REQUIRE_SIGNING: ${{ (inputs.require_signing && 'true') || vars.REQUIRE_SIGNING || 'false' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: node scripts/release/package.mjs "${{ matrix.name }}" --out "$RUNNER_TEMP/release"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}-${{ steps.package.outputs.signed == 'true' && 'signed' || 'unsigned' }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30
