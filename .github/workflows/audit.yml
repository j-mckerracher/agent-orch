name: audit

# Dependency audits. Lockfile analysis does not depend on the host OS, so one Linux runner checks
# both lockfiles; deny.toml pins the graph to the shipped macOS and Windows targets.
# Policy and exceptions: deny.toml and .cargo/audit.toml. See docs/release-ci.md.

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .cargo/audit.toml
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock
      - apps/desktop/package.json
      - apps/desktop/package-lock.json
      # DPES-1105: the pinned codeburn reader, its Node.js runtime pins, its scan record and its SBOM.
      - apps/desktop/src-tauri/sidecars/codeburn/**
      - apps/desktop/scripts/prepare-codeburn-sidecar.mjs
      - crates/orchestrator-local-usage/**
      - scripts/smoke/usage-reader.smoke.mjs
      - docs/third-party/codeburn.md
      - .github/workflows/audit.yml
  push:
    branches: [main]
  schedule:
    # New advisories appear without any change to this repository.
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

# Only a superseded pull request run is cancelled; a scheduled, main-branch or release run completes.
concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.20.0"
          package-manager-cache: false

      # Built from crates.io with their own lockfiles: the organization's actions policy allows only
      # GitHub-owned, verified and mc-* actions, so a third-party installer action cannot run.
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2

      - name: cargo deny (root workspace)
        run: cargo deny --manifest-path Cargo.toml check

      # The desktop host crate is publish = false, so deny.toml does not demand a license for it.
      - name: cargo deny (desktop host)
        run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check

      # Vulnerabilities fail. The unmaintained and unsound notes for Linux-only GTK3 crates in the
      # desktop lockfile are warnings and do not fail the step.
      - name: cargo audit (root workspace)
        run: cargo audit --file Cargo.lock

      - name: cargo audit (desktop host)
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

      - name: npm audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high

      # The codeburn runtime tree (what ships) and its bundler (build time only), checked against the
      # npm advisory database from their lockfiles. Lockfile-only: nothing is installed.
      - name: npm audit (codeburn runtime tree)
        working-directory: apps/desktop/src-tauri/sidecars/codeburn
        run: npm audit --package-lock-only --omit=dev --audit-level=high

      - name: npm audit (codeburn bundler)
        working-directory: apps/desktop/src-tauri/sidecars/codeburn/bundler
        run: npm audit --package-lock-only --audit-level=high

      # Exact totals: a skipped or failing test is never counted as a pass (see require-tap-totals.mjs).
      - name: codeburn sidecar record (exact totals)
        run: |
          node --test --test-reporter=tap apps/desktop/src-tauri/sidecars/codeburn/codeburn-sidecar.test.mjs | tee "$RUNNER_TEMP/codeburn-record.tap"
          node apps/desktop/src-tauri/sidecars/codeburn/require-tap-totals.mjs "$RUNNER_TEMP/codeburn-record.tap" 8

      # Installs the locked codeburn tree, rebuilds the bundle with the locked esbuild and checks it
      # against the pin on this runner (ubuntu). The harness runs the same test on Windows and macOS,
      # so one pin is checked on three platforms. Exact totals as above.
      - name: usage reader smoke (rebuilds the bundle from the lockfile, exact totals)
        run: |
          node --test --test-reporter=tap scripts/smoke/usage-reader.smoke.mjs | tee "$RUNNER_TEMP/usage-smoke.tap"
          node apps/desktop/src-tauri/sidecars/codeburn/require-tap-totals.mjs "$RUNNER_TEMP/usage-smoke.tap" 4

      # Warning only, never a failure: a newer Node.js 22.x release than the bundled one (nightly).
      - name: Node.js 22 update check (warning only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node apps/desktop/src-tauri/sidecars/codeburn/check-node-updates.mjs
