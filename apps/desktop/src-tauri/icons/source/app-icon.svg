<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Agent Orchestrator (MCAO) app icon</title>
  <!--
    Concept: three parallel agent streams converge into one orchestrated flow that ends in a hub.
    Colors come from the desktop dark theme tokens (apps/desktop/src/ui/theme/tokens.css):
    plate from --panel / --paper, streams from --blue (dark), hub from --ink (dark).
    Plate follows Apple's macOS template: 824 x 824 rounded square centered in 1024 x 1024,
    with a soft drop shadow. macOS does not mask third-party icons, so the plate is part of the art.
  -->
  <defs>
    <linearGradient id="plate" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d3452"/>
      <stop offset="1" stop-color="#0a121c"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" filter="url(#drop)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#a0ceff" stroke-opacity="0.22" stroke-width="8"/>
  <g fill="none" stroke-linecap="round">
    <path d="M250 330 C 400 330 430 512 580 512" stroke="#a0ceff" stroke-width="84"/>
    <path d="M250 694 C 400 694 430 512 580 512" stroke="#a0ceff" stroke-width="84"/>
    <path d="M250 512 H 580" stroke="#a0ceff" stroke-width="84"/>
    <path d="M580 512 H 730" stroke="#f2f6fb" stroke-width="100"/>
  </g>
  <circle cx="790" cy="512" r="96" fill="#f2f6fb"/>
</svg>
