risks_identified:
  - type: "tech_debt"
    description: >
      The existing runtime identity capture is unsupported on Windows, and
      owner rows created before this change have no recorded owner identity.
      Those rows are not retired from a PID alone. If a task is no longer
      Running, unresolved owners block scheduling; for a Running task with
      unavailable identity, a cancellation request may remain Pending.
    mitigation: >
      Preserve the owner and request when identity is missing, mismatched, or
      unknown. A separate runtime change is needed to capture the owner process
      creation/start identity and report Alive, Exited, or Unknown while
      detecting PID reuse; no runtime, daemon, or agent-adapter files were
      changed here.
    requires_escalation: false

notes: >
