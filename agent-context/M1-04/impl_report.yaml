uow_id: "M1-04"
status: "complete"
implementation_summary: >
  Persisted each run owner's process identity beside its generation-bound
  cancellation record. CLI cancellation and scheduling reconciliation now
  retire only an owner whose exact identity is classified Exited, atomically
  fail its pending request, and close that generation. Registration rejects a
  successor while any prior owner generation remains open.

librarian_queries: []
librarian_exploration_summaries: []

library_research:
  feature_needed: "Exact process identity capture and stale cancellation-owner reconciliation"
  libraries_checked:
    - "orchestrator_runtime::reconcile"
    - "orchestrator_core::identity"
    - "SQLite idempotency_records"
  documentation_consulted: >
    Local API documentation and source for process reconciliation, process
    identity classification, and migration 0006. No external HTTP requests.
  existing_solution_found: true
  solution_used: >
    Reused the existing ProcessIdentity observation/classification APIs and
    idempotency table. No new dependency or database migration was introduced.

files_modified:
  - path: "crates/orchestrator-store/src/sqlite_ops.rs"
    change_type: "modified"
    change_summary: >
      Persisted owner identity, listed open generations, prevented multiple
      open generations for one task, and added atomic stale-generation
      retirement that fails only that generation's pending request.
  - path: "crates/orchestrator-store/tests/cancellation_owner.rs"
    change_type: "modified"
    change_summary: >
      Added coverage for identity mismatch and absence, lifecycle/audit
      preservation, retry gating, and old-generation isolation.
  - path: "crates/orchestrator-cli/src/workflow.rs"
    change_type: "modified"
    change_summary: >
      Captured the run owner's identity and reconciled stale owners before
      scheduling and cancellation, including a post-request liveness recheck.
  - path: "crates/orchestrator-cli/tests/recovery.rs"
    change_type: "modified"
    change_summary: >
      Extended the SIGKILL recovery scenario to assert stale cancellation
      resolution and added a live-owner cancellation control.
  - path: "agent-context/M1-04/impl_report.yaml"
    change_type: "created"
    change_summary: "Recorded implementation scope, validation, and known risks."

definition_of_done_status:
  "Independently reproduce the candidate-induced recovery gap":
    met: true
    evidence: >
      Before implementation, the extended SIGKILL test observed
      Some(Pending) instead of Some(Failed) after recovery.
  "Retire only an owner proven exited by exact process identity":
    met: true
    evidence: >
      CLI reconciliation uses the stored ProcessIdentity and existing
      process planner; only ProcessClassification::Exited calls the store
      retirement operation. Identity mismatch and missing identity remain
      unresolved.
  "Resolve pending requests and close only the stale generation":
    met: true
    evidence: >
      Store retirement updates the request receipt and owner row in one
      transaction, keyed and verified by the owner generation. Retry tests
      prove registration is rejected before retirement and succeeds after it.
  "Preserve task, attempt, session, and audit outcomes":
    met: true
    evidence: >
      Store tests verify stale-owner retirement does not alter lifecycle
      records or add TaskCancelled. The CLI crash test verifies normal process
      reconciliation still records the failed attempt and exited session.
  "Prevent an old generation from affecting its successor":
    met: true
    evidence: >
      Re-retiring and confirming the old generation after successor
      registration leaves the successor request pending and its owner open.
  "Add focused crash, reconciliation, retry, and stale-generation tests":
    met: true
    evidence: >
      Added store identity/retry tests and CLI live-owner and SIGKILL recovery
      integration coverage.

