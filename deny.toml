# cargo-deny policy (M6-01). Run from the repository root:
#   cargo deny --locked check
# and for the Tauri shell, which has its own lockfile:
#   cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml check
# See docs/security/m6-01-threat-model-and-dependency-review.md.

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys < 0.39 bundles SQLite < 3.54. sqlx-sqlite 0.9.0 (latest) caps it at < 0.38, so no fix is installable. Exposure needs a crafted database plus -wal pair inside the 0700 per-user data directory. Re-evaluate on the next sqlx release." },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Unicode-3.0",
  "Zlib",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  "0BSD",
  "MPL-2.0",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
