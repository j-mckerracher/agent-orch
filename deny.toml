# cargo-deny policy for both manifests: the root workspace and apps/desktop/src-tauri.
# Run: cargo deny --manifest-path <Cargo.toml> check   (see docs/release-ci.md)

[graph]
# The shipped platforms. Linux-only crates (for example the GTK3 stack pulled in by wry)
# are not part of any build we ship and are excluded by this target list.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Keep this list in step with .cargo/audit.toml (cargo audit reads that file).
# An entry here is a known, tracked exception, not an acceptance of the risk: remove it when the
# dependency is upgraded.
ignore = [
  { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37.0 (bundled SQLite < 3.54.0) via sqlx 0.9.0. Fix needs libsqlite3-sys >= 0.39 (rusqlite 0.41 line) and an sqlx release that allows it. Needs a crafted database plus -wal file opened locally. Owner: M6-01 security audit." },
]

[licenses]
version = 2
unused-allowed-license = "allow"
confidence-threshold = 0.9
# Exactly the licenses present in the shipped graph when this file was written. MPL-2.0 is
# weak copyleft (file-level); it needs an explicit legal decision before the first public release.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

# First-party crates without a license field (publish = false) are not judged.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
